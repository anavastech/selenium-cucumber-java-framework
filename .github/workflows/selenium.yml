name: Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Suite completa todas las noches: detecta regresiones o cambios en los sitios públicos
    # aunque no haya push ese día.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # En push/PR: solo @smoke (UI en Chrome + API) para feedback rápido.
  smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run smoke tests
        run: ./mvnw -B test -Dcucumber.filter.tags="@smoke"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: |
            target/cucumber-report/
            target/allure-results/
          retention-days: 14

  # Nocturno / manual: la suite completa de UI en cada navegador, en paralelo.
  # Chrome, Firefox y Edge vienen preinstalados en ubuntu-latest.
  ui-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            tags: '@ui'
          - browser: firefox
            tags: '@ui'
          - browser: edge
            tags: '@ui'
          # Form factor secundario: solo @smoke para no triplicar el tiempo de la suite.
          - browser: chrome-mobile
            tags: '@ui and @smoke'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run UI suite on ${{ matrix.browser }}
        run: ./mvnw -B test -Dbrowser=${{ matrix.browser }} -Dcucumber.filter.tags="${{ matrix.tags }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-reports-${{ matrix.browser }}
          path: |
            target/cucumber-report/
            target/allure-results/
          retention-days: 14

  # La API no depende del navegador: corre una sola vez, fuera de la matriz.
  api-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run API suite
        run: ./mvnw -B test -Dcucumber.filter.tags="@api"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: |
            target/cucumber-report/
            target/allure-results/
          retention-days: 14
