name: Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Suite completa todas las noches: detecta regresiones o cambios en los sitios públicos
    # aunque no haya push ese día.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # En push/PR: solo @smoke (UI en Chrome + API) para feedback rápido.
  smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run smoke tests
        run: ./mvnw -B test -Dcucumber.filter.tags="@smoke"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-reports
          path: |
            target/cucumber-report/
            target/allure-results/
          retention-days: 14

  # Nocturno / manual: la suite completa de UI en cada navegador, en paralelo.
  # Chrome, Firefox y Edge vienen preinstalados en ubuntu-latest.
  ui-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            tags: '@ui'
          - browser: firefox
            tags: '@ui'
          - browser: edge
            tags: '@ui'
          # Form factor secundario: solo @smoke para no triplicar el tiempo de la suite.
          - browser: chrome-mobile
            tags: '@ui and @smoke'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Diagnóstico: si el navegador no puede ni abrir about:blank, el error real aparece aquí
      # (la excepción de Selenium solo dice "instance exited").
      - name: Check ${{ matrix.browser }} starts headless
        if: matrix.browser == 'edge'
        continue-on-error: true
        run: |
          /opt/microsoft/msedge/msedge --version
          echo "apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          timeout 60 /opt/microsoft/msedge/msedge --headless=new --disable-gpu --dump-dom about:blank

      # Ubuntu 24.04 bloquea los user namespaces sin privilegios salvo para apps con perfil AppArmor.
      # Google Chrome trae ese perfil, Edge no: sin esto su sandbox no puede iniciar y el navegador
      # se cierra al arrancar. Se levanta la restricción en el runner (efímero) en vez de usar
      # --no-sandbox, así Edge corre con el sandbox activo igual que en una máquina real.
      - name: Allow Edge sandbox (AppArmor user namespaces)
        if: matrix.browser == 'edge'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run UI suite on ${{ matrix.browser }}
        run: ./mvnw -B test -Dbrowser=${{ matrix.browser }} -Dcucumber.filter.tags="${{ matrix.tags }}" -Ddriver.log=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-reports-${{ matrix.browser }}
          path: |
            target/cucumber-report/
            target/allure-results/
            target/driver-logs/
          retention-days: 14

  # La API no depende del navegador: corre una sola vez, fuera de la matriz.
  api-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run API suite
        run: ./mvnw -B test -Dcucumber.filter.tags="@api"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-reports
          path: |
            target/cucumber-report/
            target/allure-results/
          retention-days: 14
