name: Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Suite completa todas las noches: detecta regresiones o cambios en los sitios públicos
    # aunque no haya push ese día.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # Suite completa de UI en cada navegador, en paralelo, en cada push, PR, noche o ejecución manual.
  # Chrome, Firefox y Edge vienen preinstalados en ubuntu-latest.
  ui-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            tags: '@ui'
          - browser: firefox
            tags: '@ui'
          - browser: edge
            tags: '@ui'
          # Form factor secundario: solo @smoke para no triplicar el tiempo de la suite.
          - browser: chrome-mobile
            tags: '@ui and @smoke'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Ubuntu 24.04 bloquea los user namespaces sin privilegios salvo para apps con perfil AppArmor.
      # Google Chrome trae ese perfil, Edge no: sin esto su sandbox no puede iniciar y el navegador
      # se cierra al arrancar. Se levanta la restricción en el runner (efímero) en vez de usar
      # --no-sandbox, así Edge corre con el sandbox activo igual que en una máquina real.
      - name: Allow Edge sandbox (AppArmor user namespaces)
        if: matrix.browser == 'edge'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Calentamiento: el primer arranque de Edge en un runner recién creado tarda 30-40s y, si
      # arrancan 4 a la vez (una por thread), su network service se cae y la primera navegación
      # se cuelga ("Timed out receiving message from renderer"). Un arranque previo en serie paga
      # ese costo una sola vez; los siguientes arrancan en ~1s. Si Edge no puede ni abrir la
      # página, el error real aparece aquí (la excepción de Selenium solo dice "instance exited").
      - name: Warm up ${{ matrix.browser }}
        if: matrix.browser == 'edge'
        continue-on-error: true
        run: |
          /opt/microsoft/msedge/msedge --version
          timeout 120 /opt/microsoft/msedge/msedge --headless=new --disable-gpu --dump-dom https://www.saucedemo.com > /dev/null

      - name: Run UI suite on ${{ matrix.browser }}
        run: ./mvnw -B test -Dbrowser=${{ matrix.browser }} -Dcucumber.filter.tags="${{ matrix.tags }}" -Ddriver.log=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-reports-${{ matrix.browser }}
          path: |
            target/cucumber-report/
            target/allure-results/
            target/driver-logs/
          retention-days: 14

  # La API no depende del navegador: corre una sola vez, fuera de la matriz.
  api-full:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run API suite
        run: ./mvnw -B test -Dcucumber.filter.tags="@api"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-reports
          path: |
            target/cucumber-report/
            target/allure-results/
          retention-days: 14
