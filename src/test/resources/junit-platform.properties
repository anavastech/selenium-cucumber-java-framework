# Reportes: consola, HTML autocontenido de Cucumber, JSON (para integraciones) y Allure.
cucumber.plugin=pretty,\
  html:target/cucumber-report/index.html,\
  json:target/cucumber-report/cucumber.json,\
  io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.publish.quiet=true

# Escenarios en paralelo. Cada escenario tiene su propio contenedor de PicoContainer
# (y por lo tanto su propio WebDriver), así que no comparten estado entre threads.
# Se puede bajar desde la línea de comando: -Dcucumber.execution.parallel.config.fixed.parallelism=1
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4
